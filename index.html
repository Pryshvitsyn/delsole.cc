    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const appContent = document.getElementById('app-content');
            const langToggle = document.getElementById('lang-toggle');
            const langToggleText = langToggle.querySelector('span');
            const currentYear = document.getElementById('current-year');
            currentYear.textContent = new Date().getFullYear();

            // Set initial language to English (default)
            let isItalian = false;

            // Function to update the toggle button text
            function updateToggleText() {
                if (isItalian) {
                    langToggleText.textContent = langToggleText.getAttribute('data-lang-it');
                    // Change the button text itself, using attributes on the span
                    langToggleText.setAttribute('data-lang-en', 'Passa a EN');
                    langToggleText.setAttribute('data-lang-it', 'Passa a EN');
                } else {
                    langToggleText.textContent = langToggleText.getAttribute('data-lang-en');
                    // Change the button text itself, using attributes on the span
                    langToggleText.setAttribute('data-lang-en', 'Switch to IT');
                    langToggleText.setAttribute('data-lang-it', 'Switch to IT');
                }
            }

            // Function to switch language
            function switchLanguage() {
                isItalian = !isItalian;
                if (isItalian) {
                    appContent.classList.add('lang-active');
                    document.documentElement.lang = 'it';
                } else {
                    appContent.classList.remove('lang-active');
                    document.documentElement.lang = 'en';
                }
                updateToggleText();

                // Update text content for all elements with data-lang attributes
                document.querySelectorAll('[data-lang-en], [data-lang-it]').forEach(el => {
                    const key = isItalian ? 'data-lang-it' : 'data-lang-en';
                    if (el.hasAttribute(key)) {
                        // Special handling for content inside tags that might contain markdown/HTML (like the ul items)
                        const content = el.getAttribute(key);
                        if (content && content.includes('**')) {
                             // Simple bold replacement for list items
                            el.innerHTML = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        } else {
                            // Standard text content update
                            el.textContent = content;
                        }

                    }
                });
            }

            // Initialize the content based on the default language (EN)
            // Run twice to properly initialize content and toggle state
            switchLanguage();
            switchLanguage();

            // Add event listener to the button
            langToggle.addEventListener('click', switchLanguage);

            // Set initial text for button manually
            if (isItalian) {
                 langToggleText.textContent = 'Passa a EN';
            } else {
                 langToggleText.textContent = 'Switch to IT';
            }
        });
    </script>
